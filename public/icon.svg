<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Technical Ring / Gear Accent -->
  <circle cx="256" cy="256" r="220" stroke="#f97316" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="12 10" />
  <circle cx="256" cy="256" r="195" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Speed Stripes Background -->
  <path d="M70 180 L140 180" stroke="#f97316" stroke-width="6" stroke-linecap="round" stroke-opacity="0.4" />
  <path d="M50 210 L130 210" stroke="#f97316" stroke-width="8" stroke-linecap="round" stroke-opacity="0.6" />
  <path d="M60 240 L110 240" stroke="#f97316" stroke-width="6" stroke-linecap="round" stroke-opacity="0.4" />

  <!-- Stylized Sport Motorcycle Silhouette -->
  <!-- Rear Wheel -->
  <circle cx="150" cy="320" r="62" stroke="url(#orangeGrad)" stroke-width="18" fill="none" />
  <circle cx="150" cy="320" r="32" stroke="#475569" stroke-width="6" fill="#0f172a" />
  <circle cx="150" cy="320" r="10" fill="#f97316" />

  <!-- Front Wheel -->
  <circle cx="362" cy="320" r="62" stroke="url(#orangeGrad)" stroke-width="18" fill="none" />
  <circle cx="362" cy="320" r="32" stroke="#475569" stroke-width="6" fill="#0f172a" />
  <circle cx="362" cy="320" r="10" fill="#f97316" />

  <!-- Swingarm & Chain -->
  <path d="M150 320 L245 285" stroke="#64748b" stroke-width="12" stroke-linecap="round" />

  <!-- Engine Block & Transmission -->
  <path d="M220 280 L290 280 L305 240 L235 235 Z" fill="#334155" stroke="#475569" stroke-width="4" />
  <!-- Engine Cooling Fins -->
  <line x1="240" y1="250" x2="280" y2="250" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <line x1="238" y1="262" x2="285" y2="262" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

  <!-- Exhaust Pipe -->
  <path d="M245 285 C230 315, 180 325, 140 310" fill="none" stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- Frame & Tank (Sleek aerodynamic line) -->
  <path d="M185 240 L240 215 L320 205 L355 240 L362 320" fill="none" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Motorcycle Body & Fairing -->
  <path d="M230 215 C250 180, 290 175, 335 195 L375 225 L340 255 L300 240 L245 240 Z" fill="url(#orangeGrad)" />

  <!-- Windscreen & Handlebars -->
  <path d="M325 190 L345 155 L370 185" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="340" cy="165" r="4" fill="#fff" />

  <!-- Seat & Tail -->
  <path d="M165 220 L230 215 L225 240 L180 240 Z" fill="#1e293b" />
  <path d="M160 215 L195 210 L185 230 Z" fill="#ef4444" /> <!-- Tail light -->

  <!-- Crossed Mechanic Wrench Emblem (Emphasizing CRM Taller) -->
  <g transform="translate(256, 120)">
    <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="#f97316" stroke-width="4" filter="url(#glow)" />
    <!-- Wrench icon -->
    <path d="M-15 -15 C-22 -8 -22 2 -17 7 L7 31 C10 34 15 34 18 31 L20 29 C23 26 23 21 20 18 L-4 -6 C1 -11 -3 -21 -15 -15 Z" fill="url(#metalGrad)" />
    <path d="M15 -15 C22 -8 22 2 17 7 L-7 31 C-10 34 -15 34 -18 31 L-20 29 C-23 26 -23 21 -20 18 L4 -6 C-1 -11 3 -21 15 -15 Z" fill="#ea580c" opacity="0.85" />
    <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#f97316" stroke-width="3" />
  </g>

  <!-- Brand Badge Text -->
  <text x="256" y="440" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="4">
    CRM <tspan fill="#f97316">MOTOS</tspan>
  </text>
  <text x="256" y="472" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="16" fill="#94a3b8" letter-spacing="6">
    TALLER EXPERTO
  </text>
</svg>
